dataset_params:
  im_path: 'data/train/images'
  src_path: 'E:\Image Generation\Dataset\Teens'

diffusion_params:
  num_timesteps : 1000
  beta_start : 0.0001
  beta_end : 0.02

model_params:
  im_channels : 3
  down_channels : [64, 128, 256, 512, 1024]
  mid_channels : [1024, 1024, 512]
  down_sample : [True, True, True, True]
  time_emb_dim : 512
  num_down_layers : 2
  num_mid_layers : 2
  num_up_layers : 2
  num_heads : 4

train_params:
  task_name: 'chekpoints'
  batch_size: 64
  num_epochs: 40
  num_samples : 100
  num_grid_rows : 10
  lr: 0.0001
  ckpt_name: 'nsfw_teen_ddpm_ckpt.pth'